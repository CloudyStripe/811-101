<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From Rock to Flame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D diorama; brand + path filter top-left, tools top-right,
   info panel docked right on wide screens and a bottom sheet on phones. */
:root {
  --bg: #eaf0f5;
  --sky-top: #d7e7f4;
  --sky-bottom: #f4f7f9;
  --surface: #ffffff;
  --surface-2: #f2f5f8;
  --ink: #16202a;
  --ink-2: #4b5967;
  --line: #d3dce5;
  --gas: #1a64bd;          /* gas route, text-safe on surfaces */
  --gas-fill: #2f86eb;     /* gas route lines and dots */
  --gas-soft: #e2eefc;
  --amber: #9a5c00;        /* gasoline route, text-safe */
  --amber-fill: #f2a516;
  --amber-soft: #fdf1d8;
  --stone: #6f6156;        /* shared start, text-safe */
  --stone-fill: #8e8178;
  --stone-soft: #efe9e4;
  /* numbered badges: background + ink pairs that pass 4.5:1 in both themes */
  --badge-shared: #6f6156; --badge-shared-ink: #ffffff;
  --badge-gas: #1a64bd; --badge-gas-ink: #ffffff;
  --badge-amber: #f2a516; --badge-amber-ink: #2a1a00;
  --good: #1e7d4f;
  --bad: #b3372b;
  --shadow: 0 1px 2px rgba(22, 32, 42, .08), 0 6px 20px rgba(22, 32, 42, .10);
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --panel-w: 384px;
  --edge-l: max(16px, env(safe-area-inset-left, 0px));
  --edge-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131b; --sky-top: #0b1622; --sky-bottom: #1a2836;
    --surface: #131c26; --surface-2: #1a2531; --ink: #e7edf3; --ink-2: #a5b3c1; --line: #293644;
    --gas: #7ab6ff; --gas-fill: #3d8ff0; --gas-soft: #152c47;
    --amber: #ffc457; --amber-fill: #f2a516; --amber-soft: #36270c;
    --stone: #cdbcac; --stone-fill: #9a8c82; --stone-soft: #2a241f;
    --badge-shared: #cdbcac; --badge-shared-ink: #1a1410;
    --badge-gas: #7ab6ff; --badge-gas-ink: #0c131b;
    --good: #5fd39a; --bad: #ff8a7a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131b; --sky-top: #0b1622; --sky-bottom: #1a2836;
  --surface: #131c26; --surface-2: #1a2531; --ink: #e7edf3; --ink-2: #a5b3c1; --line: #293644;
  --gas: #7ab6ff; --gas-fill: #3d8ff0; --gas-soft: #152c47;
  --amber: #ffc457; --amber-fill: #f2a516; --amber-soft: #36270c;
  --stone: #cdbcac; --stone-fill: #9a8c82; --stone-soft: #2a241f;
  --badge-shared: #cdbcac; --badge-shared-ink: #1a1410;
  --badge-gas: #7ab6ff; --badge-gas-ink: #0c131b;
  --good: #5fd39a; --bad: #ff8a7a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gas-fill); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#app { position: relative; height: 100%; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#scene:focus-visible { outline: 2px solid var(--gas-fill); outline-offset: -3px; }   /* inset: #app clips outside outlines */
#scene.dragging { cursor: grabbing; }
#scene.hovering { cursor: pointer; }

/* ---------- floating labels ---------- */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 3px 3px; border-radius: 999px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 90%, transparent); box-shadow: var(--shadow);
  font-size: 12.5px; font-weight: 700; line-height: 1.2; white-space: nowrap; pointer-events: auto; touch-action: none;
  cursor: pointer; transition: opacity .25s ease, box-shadow .2s ease, visibility 0s; will-change: transform; }
.lbl .b { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--badge-shared-ink); background: var(--badge-shared); }
.lbl[data-path="gas"] .b { background: var(--badge-gas); color: var(--badge-gas-ink); }
.lbl[data-path="gasoline"] .b { background: var(--badge-amber); color: var(--badge-amber-ink); }
.lbl.compact { padding: 2px; gap: 0; }
.lbl.compact .t { display: none; }
.lbl.dim { opacity: .38; }
/* after .dim so a hidden label stays hidden; visibility also takes it out of the tab order */
.lbl.off { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s ease, visibility 0s .25s; }
.lbl.sel { box-shadow: 0 0 0 2px var(--stone-fill), var(--shadow); }
.lbl.sel[data-path="gas"] { box-shadow: 0 0 0 2px var(--gas-fill), var(--shadow); }
.lbl.sel[data-path="gasoline"] { box-shadow: 0 0 0 2px var(--amber-fill), var(--shadow); }
.lbl:hover { box-shadow: 0 0 0 2px var(--line), var(--shadow); }
.dlbl { position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 6px; white-space: nowrap;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .01em;
  background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line);
  color: var(--ink); transition: opacity .3s ease; will-change: transform; }
.dlbl.off { opacity: 0; }
.dlbl.big { font-size: 13px; font-weight: 600; padding: 4px 9px; }
.dlbl .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px;
  vertical-align: -1px; border: 1px solid var(--ink-2); }

/* ---------- chrome ---------- */
.brand { position: absolute; left: var(--edge-l); top: 16px; display: grid; gap: 10px; max-width: min(420px, calc(100% - 32px)); pointer-events: none; }
.brand > * { pointer-events: auto; }
.brand h1 { margin: 0; font-family: var(--font-display); font-stretch: 118%; font-weight: 800;
  font-size: 22px; line-height: 1.05; letter-spacing: -.01em; text-wrap: balance; }
.brand h1 .fork { font-weight: 500; color: var(--ink-2); font-stretch: 100%; font-size: 13px; letter-spacing: .02em;
  display: block; margin-top: 4px; font-family: var(--font-body); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--shadow); width: max-content; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gas-fill); }
.seg button[data-f="gasoline"] .dot { background: var(--amber-fill); }
.seg button[data-f="both"] .dot { background: linear-gradient(90deg, var(--gas-fill) 50%, var(--amber-fill) 50%); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.seg-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: 6px; align-self: center; padding-left: 6px; }
/* back to the portal */
.home-link { display: inline-flex; align-items: center; gap: 8px; width: max-content; max-width: 100%; padding: 7px 11px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink); font-size: 13px; font-weight: 700; text-decoration: none; }
.home-link:hover { background: var(--surface-2); }
.home-link svg { width: 14px; height: 14px; flex: none; }

.tools { position: absolute; right: var(--edge-r); top: 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
  max-width: calc(100% - 32px); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; }
.tbtn:hover { background: var(--surface-2); }
.tbtn svg { width: 16px; height: 16px; flex: none; }
.tbtn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tbtn.primary:hover { opacity: .9; background: var(--ink); }
.menu { position: absolute; top: calc(100% + 6px); right: 0; min-width: 230px; padding: 6px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; gap: 2px; z-index: 5; }
.menu button { text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; cursor: pointer; display: grid; gap: 1px; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); }
.menu b { font-size: 14px; display: flex; align-items: center; gap: 7px; }
.menu small { color: var(--ink-2); font-size: 12px; }
.menu .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gas-fill); }
.menu .dot.a { background: var(--amber-fill); }
.tool-wrap { position: relative; }

.hint { position: absolute; left: var(--edge-l); bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); max-width: calc(100% - 32px); transition: opacity .4s ease; }
.hint .key { display: inline-flex; align-items: center; gap: 6px; }
.hint .sw { width: 18px; height: 6px; border-radius: 3px; background: var(--stone-fill); }
.hint .sw.g { background: var(--gas-fill); } .hint .sw.a { background: var(--amber-fill); }
.hint .sep { width: 1px; height: 14px; background: var(--line); }
.panel-open .hint { max-width: calc(100% - var(--panel-w) - 56px); }

/* ---------- info panel ---------- */
#panel { position: absolute; right: var(--edge-r); top: 72px; bottom: 16px; width: var(--panel-w); display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  transform: translateX(0); transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s ease; overflow: hidden; z-index: 3; }
#panel.closed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.p-head { padding: 16px 18px 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); position: relative; }
.p-eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 36px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
  font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--stone-soft); color: var(--stone); }
.chip.gas { background: var(--gas-soft); color: var(--gas); }
.chip.gasoline { background: var(--amber-soft); color: var(--amber); }
.p-step { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
#p-title { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-weight: 750; font-size: 23px; line-height: 1.15;
  letter-spacing: -.01em; text-wrap: balance; padding-right: 30px; }
.close { position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.close:hover { background: var(--surface-2); }
.close svg { width: 16px; height: 16px; }
.p-body { padding: 14px 18px 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; min-height: 0; flex: 1; overscroll-behavior: contain; }
.p-body p { margin: 0; }
.lead { font-size: 15.5px; line-height: 1.6; }
.box { padding: 11px 13px; border-radius: 11px; background: var(--surface-2); display: grid; gap: 3px; font-size: 14px; line-height: 1.5; }
.box h3 { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.box.fact { background: var(--gas-soft); }
.box.fact h3 { color: var(--gas); }
.p-gasoline .box.fact { background: var(--amber-soft); }
.p-gasoline .box.fact h3 { color: var(--amber); }
.p-shared .box.fact { background: var(--stone-soft); }
.p-shared .box.fact h3 { color: var(--stone); }
.trade { font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--line); padding: 2px 0 2px 11px; }
.trade b { color: var(--ink); }
.note { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.eq { font-family: var(--font-mono); font-size: 14px; font-weight: 600; padding: 9px 12px; border-radius: 9px; border: 1px dashed var(--line); text-align: center; }
.term { border: 0; padding: 0 1px; background: none; font: inherit; color: inherit; cursor: help;
  text-decoration: underline dotted 1.5px; text-underline-offset: 3px; text-decoration-color: var(--ink-2);
  font-weight: 700; border-radius: 3px; }
.p-gas .term { text-decoration-color: var(--gas-fill); }
.p-gasoline .term { text-decoration-color: var(--amber-fill); }
.term:hover, .term[aria-expanded="true"] { background: var(--surface-2); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts.split { justify-content: space-between; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 700; }
.btn:hover { background: var(--surface-2); }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.gas { background: var(--badge-gas); border-color: var(--badge-gas); color: var(--badge-gas-ink); }
.btn.gasoline { background: var(--badge-amber); border-color: var(--badge-amber); color: var(--badge-amber-ink); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.strokes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.strokes div { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); font-size: 13px; line-height: 1.4; transition: background .2s, border-color .2s; }
.strokes div b { display: block; font-family: var(--font-mono); font-size: 12px; }
.strokes div.on { background: var(--amber-soft); border-color: var(--amber-fill); }
.tl { display: grid; gap: 8px; padding: 12px; border-radius: 11px; border: 1px solid var(--line); }
.tl-count { font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tl-count small { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.tl-cap { font-size: 14px; min-height: 42px; }
.tl-bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.tl-bar i { display: block; height: 100%; width: 0; background: var(--stone-fill); }
.tiny { font-size: 12px; color: var(--ink-2); }

/* overview route map */
.rmap-wrap { width: 100%; }
.rmap { width: 100%; height: auto; aspect-ratio: 344 / 152; display: block; }
.rmap .ln { fill: none; stroke-width: 4; }
.rmap .ln.shared { stroke: var(--stone-fill); } .rmap .ln.gas { stroke: var(--gas-fill); } .rmap .ln.gasoline { stroke: var(--amber-fill); }
.rmap .lbt { font-family: var(--font-body); font-size: 11px; font-weight: 700; }
.rmap .lbt.shared { fill: var(--stone); } .rmap .lbt.gas { fill: var(--gas); } .rmap .lbt.gasoline { fill: var(--amber); }
.rmap .st { cursor: pointer; }
.rmap .st circle { stroke: var(--surface); stroke-width: 2; }
.rmap .st text { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.rmap .st.shared circle { fill: var(--badge-shared); } .rmap .st.shared text { fill: var(--badge-shared-ink); }
.rmap .st.gas circle { fill: var(--badge-gas); } .rmap .st.gas text { fill: var(--badge-gas-ink); }
.rmap .st.gasoline circle { fill: var(--badge-amber); } .rmap .st.gasoline text { fill: var(--badge-amber-ink); }
.rmap .st:hover circle, .rmap .st:focus-visible circle { stroke: var(--ink); stroke-width: 2.5; }
.tourpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tourpick button { text-align: left; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; display: grid; gap: 2px; }
.tourpick button:hover { background: var(--surface-2); }
.tourpick b { display: flex; align-items: center; gap: 7px; font-size: 14.5px; }
.tourpick small { color: var(--ink-2); font-size: 12.5px; }
.tourpick .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gas-fill); }
.tourpick .dot.a { background: var(--amber-fill); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }

/* tour footer */
.p-foot { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 14px;
  border-top: 1px solid var(--line); background: var(--surface); }
.p-prog { display: grid; gap: 5px; justify-items: center; min-width: 0; }
.p-prog span { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.done { background: var(--ink-2); }
.dots i.cur { background: var(--gas-fill); transform: scale(1.3); }
.t-gasoline .dots i.cur { background: var(--amber-fill); }

/* quiz */
.q { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.q h4 { margin: 0; font-size: 15px; }
.q .opts { display: grid; gap: 6px; }
.q .opts button { text-align: left; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; }
.q .opts button:hover:not(:disabled) { background: var(--surface-2); }
.q .opts button.right { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.q .opts button.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.q .opts button:disabled { cursor: default; }
.q .mark { display: block; font-size: 12px; font-weight: 700; margin-top: 2px; }
.q .right .mark { color: var(--good); } .q .wrong .mark { color: var(--bad); }
.q .fb { font-size: 13.5px; }
.q .fb b.ok { color: var(--good); } .q .fb b.no { color: var(--bad); }
.score { font-family: var(--font-display); font-stretch: 112%; font-weight: 750; font-size: 18px; }

/* tooltip */
#tip { position: fixed; z-index: 20; max-width: 280px; padding: 9px 11px; border-radius: 10px; background: var(--ink); color: var(--bg);
  font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); pointer-events: none; }
#tip b { display: block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .75; margin-bottom: 2px; }

/* modal */
.modal { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(3px); }
.modal-card { position: relative; width: min(760px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; }
.modal-card h2 { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-weight: 750; font-size: 22px; padding-right: 40px; text-wrap: balance; }
#m-body { display: grid; gap: 14px; }
.mol-wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mol { display: grid; gap: 6px; align-content: start; }
/* a light "lightbox" in both themes so dark carbon atoms stay visible */
.mol canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #e3eaf0, #b4c2cf);
  display: block; touch-action: none; cursor: grab; }
.mol h3 { margin: 0; font-family: var(--font-mono); font-size: 15px; }
.mol p { margin: 0; font-size: 13.5px; color: var(--ink-2); }

    justify-content: center; flex-wrap: nowrap; z-index: 4; transition: bottom .35s cubic-bezier(.2,.8,.2,1); }

<div id="app">

<script>
/* =====================================================================
   STAGE CONTENT — edit freely.
   Each stage: id, path ('shared' | 'gas' | 'gasoline'), step number,
   label (short floating label), title, text, analogy, fact, optional
   tradeoff / note / equation, terms (word -> one-line definition),
   camera {pos, look} for the fly-to view, and labelAt (label anchor).
   In any text, wrap a term in [[double brackets]] to highlight it.
   Use [[shown words|term key]] when the words differ from the key.
   ===================================================================== */
const STAGES = [
  // ---------------- SHARED START ----------------
  {
    id: 'formation', path: 'shared', step: 1, label: 'Ancient sea life',
    title: 'It starts with tiny sea life',
    text: 'Long ago, the oceans were full of [[plankton]]: tiny plants and animals, most too small to see. When they died, they sank into the mud on the seafloor, where there was too little oxygen for them to rot away completely. Layer after layer of mud and sand buried them deeper, and the heat and pressure down there slowly "cooked" them into oil and gas. The dark, buried mud became [[source rock]].',
    analogy: 'It\'s like a slow cooker that runs for millions of years: low heat, lots of time, and the ingredients completely change.',
    fact: 'Oil and gas don\'t come from dinosaurs. They come mostly from plankton and algae, which were far more plentiful.',
    terms: {
      'plankton': 'Tiny living things that drift in water, like algae and microscopic animals.',
      'source rock': 'Rock that formed from mud rich in ancient life. Oil and gas are created inside it.'
    },
    camera: { pos: [-67, 1, 61], look: [-42, -7, 17] },
    labelAt: [-47.5, 2.4, 18]
  },
  {
    id: 'reservoir', path: 'shared', step: 2, label: 'Trapped in rock',
    title: 'Hiding in rock, like water in a sponge',
    text: 'Oil and gas are lighter than water, so over time they creep upward through the rock. Many end up in [[reservoir rock]], such as sandstone, filling the tiny [[pores]] between its grains. A layer of [[cap rock]] above works like a lid and stops them escaping. Under that lid they sort by weight: gas on top, oil in the middle, and salty water at the bottom.',
    analogy: 'Think of a sponge, not a bucket. The oil is soaked into the rock\'s tiny holes, and there is no underground lake to dip into.',
    fact: 'Even good reservoir rock is mostly solid. Often only about 10–30% of it is open space (approximate).',
    terms: {
      'reservoir rock': 'Rock with many tiny connected holes that can hold oil, gas or water and let them flow.',
      'pores': 'The tiny spaces between the grains of a rock.',
      'cap rock': 'A tight layer of rock, like shale or salt, that fluids can\'t pass through. It seals oil and gas in.'
    },
    camera: { pos: [-27, -1, 62], look: [-28, -7, 24] },
    labelAt: [-24, -3.6, 24.4]
  },
  {
    id: 'drilling', path: 'shared', step: 3, label: 'Find & drill',
    title: 'Finding it, then drilling down',
    text: 'Crews first run a [[seismic survey]]: they send sound waves into the ground and record the echoes to map the rock layers. Then a drilling rig bores a hole, often a few kilometers deep, and lines it with steel [[casing]] and cement to seal it off from [[groundwater]]. In tight rock like [[shale]], the well can turn sideways, called [[horizontal drilling]]. Then [[hydraulic fracturing]] cracks the rock open so oil and gas can flow out.',
    analogy: 'A seismic survey is like an ultrasound for the Earth: sound goes in, echoes come back, and a computer turns them into a picture.',
    fact: 'Drillers can steer a well like a car, using sensors near the drill bit to stay inside a rock layer only a few meters thick.',
    tradeoff: 'Fracking unlocked huge amounts of oil and gas, but it uses a lot of water and creates wastewater that must be handled carefully. Injecting that wastewater deep underground has been linked to earthquakes in some regions, mostly small but a few strong enough to cause damage.',
    terms: {
      'seismic survey': 'Mapping underground rock by sending sound waves down and timing their echoes.',
      'casing': 'Steel pipe cemented into a well to keep it stable and sealed off from the rock around it.',
      'groundwater': 'Fresh water held in soil and rock near the surface. Many people drink it from wells.',
      'shale': 'A rock made from hardened mud. Its pores are so tiny that oil and gas barely move through it.',
      'horizontal drilling': 'Steering a well to turn and run sideways through a rock layer, often for 2–3 km or more (approximate).',
      'hydraulic fracturing': 'Pumping water, sand and a little chemical additive into a well at high pressure to crack the rock. Also called fracking.'
    },
    camera: { pos: [-12, 6, 67], look: [-15, -2.5, 21] },
    labelAt: [-21, 12.4, 22]
  },
  {
    id: 'lifting', path: 'shared', step: 4, label: 'Up & split',
    title: 'Up the well, then sorted three ways',
    text: 'Gas usually rushes up the well on its own, pushed by the pressure underground. Oil is heavier, so many wells need a [[pump jack]] to lift it. What comes up is a mix of gas, oil and salty water. At the wellsite, a [[separator]] lets the mix settle: gas rises out the top, oil collects in the middle, and water sinks to the bottom.',
    analogy: 'It\'s like a bottle of salad dressing left to sit. The parts settle into layers on their own.',
    fact: 'Many older oil wells bring up more salty water than oil. That "produced water" is cleaned, reused or pumped back deep underground.',
    note: 'This is the fork: gas heads off along the blue route, oil along the amber one.',
    terms: {
      'pump jack': 'A nodding machine at an oil well. It moves a long rod up and down to lift oil to the surface.',
      'separator': 'A tank that lets the gas, oil and water coming out of a well separate by weight.'
    },
    camera: { pos: [-22, 13, 44], look: [-31, -0.5, 17] },
    labelAt: [-28, 3.2, 13.5]
  },

  // ---------------- NATURAL GAS PATH ----------------
  {
    id: 'gas-plant', path: 'gas', step: 5, label: 'Gas plant',
    title: 'Cleaning up the gas',
    text: 'Raw gas from the well isn\'t ready to use. At a [[processing plant]], it\'s dried, and impurities like carbon dioxide and poisonous hydrogen sulfide are removed. The plant also pulls out heavier gases such as propane and butane, called [[natural gas liquids]], which are sold separately. What\'s left is mostly [[methane]], the gas that reaches homes and power plants.',
    analogy: 'It\'s like a water filter for gas: the useful part passes through, and everything else is caught and sorted.',
    fact: 'In the US, most propane, about three-quarters (approximate), comes from gas plants like this one. Most of the rest comes from oil refineries.',
    tradeoff: 'Plants sometimes burn off extra gas in a tall [[flare]] for safety. Flaring wastes gas and releases CO₂ and some pollution.',
    terms: {
      'processing plant': 'A facility that cleans raw natural gas and separates it into useful parts.',
      'natural gas liquids': 'Heavier gases like ethane, propane and butane that come out of natural gas. Also called NGLs.',
      'methane': 'The simplest carbon-based fuel: one carbon atom and four hydrogen atoms (CH₄). It is the main part of natural gas.',
      'flare': 'A tall burner that safely burns off gas that can\'t be used or stored.'
    },
    camera: { pos: [-1, 17, 13], look: [-14, 1.5, -9.5] },
    labelAt: [-15, 7, -11]
  },
  {
    id: 'pipeline', path: 'gas', step: 6, label: 'Pipeline',
    title: 'Pushed along long pipelines',
    text: 'Clean gas travels long distances through buried steel [[pipelines]], some about a meter wide (approximate). Gas loses pressure as it rubs along the pipe walls. So every 80–160 km or so (50–100 miles, approximate), a [[compressor station]] squeezes it back up to keep it moving.',
    analogy: 'Compressor stations are like relay runners: each one gives the gas a fresh push for the next leg of the trip.',
    fact: 'Devices nicknamed "pigs" ride the gas flow through pipelines to clean them, and some carry sensors that check the walls for wear.',
    tradeoff: 'Pipelines move huge amounts of gas quietly underground, but leaks can release methane and occasionally cause fires, so they are monitored and inspected.',
    terms: {
      'pipelines': 'Long steel pipes, usually buried, that carry gas or liquids over long distances.',
      'compressor station': 'A facility along a pipeline that squeezes the gas to raise its pressure so it keeps flowing.'
    },
    camera: { pos: [11, 12, 4], look: [1.5, 1, -11.5] },
    labelAt: [2, 4.6, -12.5]
  },
  {
    id: 'storage-lng', path: 'gas', step: 7, label: 'Storage & LNG',
    title: 'Saved for winter, or shipped overseas',
    text: 'People use far more gas in winter for heating. So in warmer months, companies pump extra gas into [[underground storage]], such as old gas fields or huge caverns carved out of underground salt, and pull it back out when it\'s cold. To cross oceans, gas is chilled to about −162 °C (−260 °F) until it becomes a liquid called [[LNG]]. Special ships carry it, and at the other end it\'s warmed back into a gas.',
    analogy: 'Storage works like a pantry: you stock up when food is plentiful and use it when you need it most.',
    fact: 'Turning gas into LNG shrinks it to about 1/600th of its volume (approximate). That\'s what makes shipping it worthwhile.',
    tradeoff: 'LNG lets countries buy gas from far away, but chilling, shipping and re-warming it uses a lot of energy.',
    terms: {
      'underground storage': 'Places deep underground, like old gas fields or caverns in salt, where gas is kept until it\'s needed.',
      'LNG': 'Liquefied natural gas: natural gas chilled until it turns into a liquid, so it takes up far less space.'
    },
    camera: { pos: [-6, 12, -60], look: [14, -3, -23] },
    labelAt: [19.5, 5.4, -19.5]
  },
  {
    id: 'city-gate', path: 'gas', step: 8, label: 'City gate',
    title: 'Into town: lower pressure, added smell',
    text: 'At the [[city gate]], gas leaves the big pipeline and enters the local network. A [[pressure regulator]] lowers its pressure a lot, and an [[odorant]] is added, because natural gas has no smell of its own. Smaller pipes under the streets then carry the gas to a [[gas meter]] at each building.',
    analogy: 'It\'s like leaving the highway for neighborhood streets: everything slows down and spreads out to reach each house.',
    fact: 'Adding a smell to gas became standard after a deadly 1937 gas explosion at a school in New London, Texas.',
    tradeoff: 'Safety tip: if you ever smell rotten eggs indoors, leave right away and call the gas company from outside.',
    terms: {
      'city gate': 'The station where gas moves from a long-distance pipeline into a local delivery network.',
      'pressure regulator': 'A valve that automatically lowers gas pressure to a safe, steady level.',
      'odorant': 'A strong-smelling sulfur chemical added to gas so leaks can be noticed.',
      'gas meter': 'A device on the outside of a building that measures how much gas it uses.'
    },
    camera: { pos: [27, 10, 3], look: [17.5, 1, -8.5] },
    labelAt: [17, 3.4, -9]
  },
  {
    id: 'gas-uses', path: 'gas', step: 9, label: 'Using gas',
    title: 'Electricity, heat and things we make',
    text: 'Much natural gas goes to [[power plants]], which burn it to spin [[turbines]] that make electricity. In homes it fuels furnaces, stoves and water heaters. Factories use it for heat and also as an ingredient: most nitrogen [[fertilizer]] is made from natural gas, and many plastics start from the gas liquids pulled out at the processing plant.',
    analogy: 'Natural gas is a utility player: the same fuel can light a city, cook dinner and help grow food.',
    fact: 'In the US, natural gas makes roughly 40% of the electricity, more than any other source (approximate, recent years).',
    tradeoff: 'Gas power plants can ramp up quickly when demand spikes, which helps keep the power supply steady, but they still release CO₂.',
    terms: {
      'power plants': 'Facilities that make electricity, often by burning fuel to spin a generator.',
      'turbines': 'Machines with blades that spin when gas or steam rushes through them, turning a generator.',
      'fertilizer': 'Nutrients added to soil to help crops grow. Nitrogen fertilizer is mostly made from natural gas.'
    },
    camera: { pos: [35, 30, 22], look: [31, 1, -8] },
    labelAt: [37.5, 9.4, -17]
  },
  {
    id: 'gas-burning', path: 'gas', step: 10, label: 'Burning gas',
    title: 'Burning gas: heat, water and CO₂',
    text: 'When methane burns, it combines with oxygen from the air. Each methane molecule becomes one molecule of [[carbon dioxide]] and two of water vapor, and gives off heat. Natural gas burns cleaner than coal or oil, with less soot and less CO₂ for the same heat. But it still adds CO₂ to the air, and methane that leaks before it\'s burned is a powerful [[greenhouse gas]].',
    equation: 'CH₄ + 2 O₂ → CO₂ + 2 H₂O + heat',
    analogy: 'Burning is a quick swap of partners: the same atoms rearrange, and the energy that held them together comes out as heat.',
    fact: 'For the same amount of heat, burning gas releases roughly half the CO₂ of coal and about a quarter less than gasoline (approximate).',
    tradeoff: 'Over 20 years, leaked methane traps roughly 80 times more heat than the same weight of CO₂ (approximate), so how much leaks along the way matters a lot for gas\'s overall climate impact.',
    terms: {
      'carbon dioxide': 'CO₂: a gas made when fuels containing carbon burn. It traps heat in the atmosphere.',
      'greenhouse gas': 'A gas that traps heat in the atmosphere and warms the planet.'
    },
    camera: { pos: [27, 7, 10], look: [24.5, 2, 3] },
    labelAt: [24.5, 4.4, 3]
  },

  // ---------------- GASOLINE PATH ----------------
  {
    id: 'crude-transport', path: 'gasoline', step: 5, label: 'To the refinery',
    title: 'Moving crude oil to a refinery',
    text: '[[Crude oil|crude oil]] is the thick, dark oil that comes out of the ground. On land, most of it travels through pipelines. Giant [[tanker]] ships carry it across oceans, and trains and trucks fill in where there are no pipes. Its destination is a refinery, where the real transformation happens.',
    analogy: 'Crude oil is like raw ingredients delivered to a restaurant kitchen: useful, but not ready to serve.',
    fact: 'A very large tanker can carry about 2 million [[barrels]] of crude (approximate).',
    tradeoff: 'Spills from pipelines, trains or ships are uncommon but can badly harm land and water, so routes are inspected and regulated.',
    terms: {
      'crude oil': 'Oil as it comes out of the ground: a dark mix of many different molecules made of hydrogen and carbon.',
      'tanker': 'A ship built to carry liquids like crude oil in huge tanks.',
      'barrels': 'The standard unit for oil: 42 US gallons, about 159 liters.'
    },
    camera: { pos: [-12, 18, 31], look: [-13.5, 0.5, 14.5] },
    labelAt: [-15, 3.4, 15.5]
  },
  {
    id: 'distillation', path: 'gasoline', step: 6, label: 'Distillation tower',
    title: 'Sorting crude by boiling point',
    text: 'Crude is a mix of thousands of different molecules, big and small. A furnace heats it to roughly 350–400 °C (approximate), turning much of it to vapor. The vapor rises up a tall [[distillation tower]] and cools as it climbs, and each part turns back to liquid at its own [[boiling point]]: gasoline near the top, then jet fuel, diesel and heavy oils lower down. Light gases leave from the very top, and the heaviest part, which never boils, collects at the bottom as [[asphalt]].',
    analogy: 'It works like steam fogging a cold bathroom mirror: vapor turns back to liquid when it cools. The tower does this at many temperatures, one level at a time.',
    fact: 'After all of a refinery\'s steps, a 42-gallon barrel of crude yields about 19–20 gallons of gasoline at US refineries (approximate), plus diesel, jet fuel and more.',
    terms: {
      'distillation tower': 'A tall column that separates a liquid mix by letting its parts condense at different heights.',
      'boiling point': 'The temperature where a liquid turns into a gas, or a gas turns back into a liquid as it cools.',
      'asphalt': 'The thick, sticky leftover at the bottom of the barrel, used to pave roads.'
    },
    camera: { pos: [11, 9, 37], look: [-1, 6, 14] },
    labelAt: [-1, 13.4, 14]
  },
  {

/* Materials are cached per stage so a stage can be dimmed on its own.
   o.own = a private material the stage animates itself (color, emissive or opacity). */
function mat(hex, o = {}) {
  const key = [BUILD.id || '_', hex, o.op ?? 1, o.em ?? 0, o.basic ? 1 : 0, o.side || 0].join('|');
  let m = o.own ? null : matCache.get(key);
  if (!m) {
    m = o.basic
      ? new THREE.MeshBasicMaterial({ color: hex })
      : new THREE.MeshPhongMaterial({ color: hex, flatShading: true, shininess: 10, specular: 0x111111 });
    if (o.em != null && !o.basic) m.emissive = new THREE.Color(o.em);
    if (o.op != null && o.op < 1) { m.transparent = true; m.opacity = o.op; m.depthWrite = false; }
    if (o.side) m.side = o.side;
    m.userData.base = new THREE.Color(hex);
    m.userData.baseOp = m.opacity;
    m.userData.baseEm = m.emissive ? m.emissive.clone() : null;
    m.userData.own = !!o.own;
    if (!o.own) matCache.set(key, m);
    if (BUILD.id) ST[BUILD.id].mats.add(m);
  }
  return m;
}

}

  const m = new THREE.Mesh(geo, o.m || mat(hex, o));

  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;

}

const cyl = (rt, rb, h, hex, x, y, z, o = {}) => M(new THREE.CylinderGeometry(rt, rb, h, o.seg || 10, 1, !!o.open), hex, x, y + h / 2, z, o);

  street: { z: -1.2 },                                // town street the gas main runs along
  car: { x: 34, z: 11 }                               // car on the road (engine + tailpipe stages)
};
function xs(a, b, step = 1.2) {
  const n = Math.max(2, Math.ceil((b - a) / step));
  return Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);
}
function shapeFrom(pts) {
  const clean = pts.filter((p, i) => i === 0 || Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) > 1e-3);
  const s = new THREE.Shape();
  s.moveTo(clean[0][0], clean[0][1]);
  for (let i = 1; i < clean.length; i++) s.lineTo(clean[i][0], clean[i][1]);
  return s;
}
function bandPts(x0, x1, top, bot, step) {
  const X = xs(x0, x1, step), pts = [];
  X.forEach(x => pts.push([x, top(x)]));
  for (let i = X.length - 1; i >= 0; i--) pts.push([X[i], bot(X[i])]);
  return pts;
}
function extrude(pts, hex, z0, z1, o = {}) {
  const g = new THREE.ExtrudeGeometry(shapeFrom(pts), { depth: z1 - z0, bevelEnabled: false, curveSegments: 1 });
  g.translate(0, 0, z0);
  return M(g, hex, 0, 0, 0, o);
}
/* find x where f(x) crosses level c between a and b (bisection) */
function crossX(f, c, a, b) {
  let lo = a, hi = b, flo = f(lo) - c;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2, fm = f(mid) - c; if ((fm > 0) === (flo > 0)) { lo = mid; flo = fm; } else hi = mid; }
  return (lo + hi) / 2;
}

/* inner layers of a horizontal tank: a band of a circle, extruded along x */
function circBand(r, a, b) {
  const pts = [], N = 8, w = y => Math.sqrt(Math.max(0, r * r - y * y));
  for (let i = 0; i <= N; i++) { const y = a + (b - a) * i / N; pts.push([-w(y), y]); }
  for (let i = N; i >= 0; i--) { const y = a + (b - a) * i / N; pts.push([w(y), y]); }
  return pts;
}

/* =====================================================================
   NATURAL GAS PATH
   ===================================================================== */
function flame(x, y, z, s = 1, hex = 0xff8a2b) {
  const g = grp(x, y, z, { dyn: 1 });
  within(g, () => {
    M(new THREE.ConeGeometry(0.32 * s, 1.1 * s, 6), hex, 0, 0.55 * s, 0, { em: hex, cast: false, dyn: 1 });
    M(new THREE.ConeGeometry(0.17 * s, 0.65 * s, 6), 0xffe07a, 0, 0.36 * s, 0, { em: 0xffc94a, cast: false, dyn: 1 });
  });
  return g;
}
/* drifting puffs (steam, smoke, smell, exhaust); each fades on its own, so each owns its material */
const PUFF_GEO = new THREE.IcosahedronGeometry(0.3, 0);
function puffs(n, hex, op = 0.55) {
  return Array.from({ length: n }, () => {
    const m = new THREE.Mesh(PUFF_GEO, mat(hex, { op, own: true }));
    m.userData.dyn = 1; m.visible = false; BUILD.parent.add(m); return m;
  });
}
function runPuffs(list, t, on, src, rise = 3, spread = 0.6, cycle = 2.6) {
  list.forEach((m, i) => {
    const p = ((t / cycle) + i / list.length) % 1;
    m.visible = on;
    if (!on) return;
    m.position.set(src[0] + Math.sin(i * 7.1) * spread * p, src[1] + p * rise, src[2] + Math.cos(i * 3.3) * spread * p);
    m.scale.setScalar(0.4 + p * 1.4);
    m.material.opacity = (1 - p) * m.material.userData.baseOp;
  });
}
function roofGeo(w, h, L) {
  const g = new THREE.ExtrudeGeometry(shapeFrom([[-w / 2, 0], [w / 2, 0], [0, h]]), { depth: L, bevelEnabled: false });
  g.translate(0, 0, -L / 2); g.rotateY(Math.PI / 2);
  return g;
}

stage('distillation', () => {
  const { x: tx, z: tz } = SITE.tower, R = 1.45, H = 12, fx = tx - 3.8;   // fx: furnace
  pad(8.8, 6.4, tx - 1.8, tz);
  box(2.4, 2.2, 2.4, 0xb5654a, fx, 0, tz);
  box(2.5, 0.25, 2.5, 0x7d4434, fx, 2.2, tz);
  const glowMat = mat(0xff8a2b, { own: true, em: 0xc24a00 });
  M(new THREE.BoxGeometry(1.6, 0.5, 0.05), 0, fx, 0.85, tz + 1.22, { m: glowMat });
  cyl(0.24, 0.3, 3.2, 0x7d4434, fx - 0.6, 2.4, tz - 0.6, { seg: 8 });
  rod([fx + 1.2, 1.0, tz], [tx - R + 0.05, 1.0, tz], 0.18, 0x8796a3);
  cyl(R + 0.15, R + 0.25, 0.6, 0x8796a3, tx, 0, tz, { seg: 18 });
  M(new THREE.CylinderGeometry(R, R, H - 0.6, 20, 1, true), 0xdfeaf3, tx, 0.6 + (H - 0.6) / 2, tz, { op: 0.24, side: THREE.DoubleSide, cast: false, recv: false });
  M(new THREE.SphereGeometry(R, 20, 6, 0, Math.PI * 2, 0, Math.PI / 2), 0xb8c2cc, tx, H, tz);
  const bands = [
    ['Asphalt', 0x2b2622, 0.6, 2.3], ['Heavy oils', 0x8a5a2b, 2.3, 4.2], ['Diesel', 0xc9a227, 4.2, 6.0],
    ['Jet fuel', 0xf3e27a, 6.0, 7.8], ['Gasoline', 0xffb31a, 7.8, 9.8], ['Light gases', 0xcfe9ff, 9.8, 11.8]
  ];
  bands.forEach(([name, c, y0, y1]) => {
    cyl(R - 0.14, R - 0.14, y1 - y0 - 0.06, c, tx, y0 + 0.03, tz, { op: 0.62, cast: false, recv: false, seg: 18 });
    cyl(R - 0.04, R - 0.04, 0.07, 0x6f7d86, tx, y0, tz, { seg: 18, cast: false });
    const ym = (y0 + y1) / 2;
    rod([tx + R - 0.05, ym, tz], [tx + R + 1.0, ym, tz], 0.11, c);
    rod([tx + R + 1.0, ym, tz], [tx + R + 1.0, ym - 0.5, tz], 0.11, c);
    detail(name, [tx + R + 1.35, ym, tz], { swatch: '#' + c.toString(16).padStart(6, '0') });
  });
  // vapor dots rise and condense at their own level
  const N = 70, vap = pointsCloud(N, 0.24);
  const vp = vap.geometry.attributes.position.array, vc = vap.geometry.attributes.color.array;
  const tgt = new Float32Array(N), spd = new Float32Array(N), life = new Float32Array(N);
  const hot = new THREE.Color(0xffe2bf), tmp = new THREE.Color(), bandCol = bands.map(b => new THREE.Color(b[1]));
  function spawn(i) {
    const a = Math.random() * 6.28, r = Math.random() * (R - 0.35);
    vp[i * 3] = tx + Math.cos(a) * r; vp[i * 3 + 1] = 0.9 + Math.random() * 0.4; vp[i * 3 + 2] = tz + Math.sin(a) * r;
    const b = 1 + Math.floor(Math.random() * 5);           // bands 1..5 (asphalt stays at the bottom)
    tgt[i] = b; spd[i] = 1.4 + Math.random() * 1.2; life[i] = 0;
  }
  for (let i = 0; i < N; i++) { spawn(i); vp[i * 3 + 1] = 0.9 + Math.random() * 10; }
  vap.visible = false;
  hit(tx, 6.1, tz, 3.4, 12.6, 3.4);
  hit(fx, 1.3, tz, 2.8, 2.8, 2.8);
  detail('Furnace: about 350–400 °C', [fx, 3.1, tz + 1.3]);
  onAnim((t, dt, active, k) => {
    const on = k > 0.05, lit = 1 - ST.distillation.dim;   // the furnace glow fades with the path filter
    glowMat.emissive.setRGB((on ? 0.75 + Math.sin(t * 11) * 0.1 : 0.5) * lit, (on ? 0.3 : 0.2) * lit, 0);
    vap.visible = on;
    if (!on) return;
    for (let i = 0; i < N; i++) {
      const b = bands[tgt[i]], ym = (b[2] + b[3]) / 2;
      let y = vp[i * 3 + 1];
      if (y < ym) {
        y = Math.min(ym, y + dt * spd[i]);
        tmp.copy(hot).lerp(bandCol[tgt[i]], clamp((y - 0.9) / (ym - 0.9), 0, 1) * 0.6);
      } else {
        life[i] += dt;
        tmp.copy(bandCol[tgt[i]]);
        if (life[i] > 0.9) { spawn(i); y = vp[i * 3 + 1]; }
      }
      vp[i * 3 + 1] = y;
      vc[i * 3] = tmp.r; vc[i * 3 + 1] = tmp.g; vc[i * 3 + 2] = tmp.b;
    }
    vap.geometry.attributes.position.needsUpdate = true;
    vap.geometry.attributes.color.needsUpdate = true;
  });
});

function roundedPath(pts, rad = 1.3) {
  const P = pts.map(p => V3(...p)), path = new THREE.CurvePath();
  let cur = P[0].clone();
  for (let i = 1; i < P.length - 1; i++) {
    const a = P[i - 1], b = P[i], c = P[i + 1];
    const d1 = b.clone().sub(a), d2 = c.clone().sub(b);
    const r = Math.min(rad, d1.length() * 0.45, d2.length() * 0.45);
    const p1 = b.clone().sub(d1.normalize().multiplyScalar(r)), p2 = b.clone().add(d2.normalize().multiplyScalar(r));
    if (cur.distanceTo(p1) > 1e-3) path.add(new THREE.LineCurve3(cur.clone(), p1));
    path.add(new THREE.QuadraticBezierCurve3(p1, b.clone(), p2));
    cur = p2;
  }
  path.add(new THREE.LineCurve3(cur, P[P.length - 1].clone()));
  return path;
}

const DARK = new THREE.Color(PCOL.crude), AMBER = new THREE.Color(PCOL.product), _rc = new THREE.Color();
/* put every particle at its spot along the route; refined product shades from crude-dark to amber */
function placeParticles(rt) {
  const pos = rt.pts.geometry.attributes.position.array, col = rt.pts.geometry.attributes.color.array;
  rt.seeds.forEach((s, i) => {
    const u = (s + rt.u) % 1, f = u * rt.S, k = Math.floor(f), w = f - k;
    const a = rt.samples[k], b = rt.samples[Math.min(k + 1, rt.S)];
    pos[i * 3] = a.x + (b.x - a.x) * w;
    pos[i * 3 + 1] = a.y + (b.y - a.y) * w + 0.12;
    pos[i * 3 + 2] = a.z + (b.z - a.z) * w;
    if (rt.R.refineEnd) {
      _rc.copy(DARK).lerp(AMBER, clamp(u / rt.R.refineEnd, 0, 1));
      col[i * 3] = _rc.r; col[i * 3 + 1] = _rc.g; col[i * 3 + 2] = _rc.b;
    }
  });
  rt.pts.geometry.attributes.position.needsUpdate = true;
  if (rt.R.refineEnd) rt.pts.geometry.attributes.color.needsUpdate = true;
}

const routes = ROUTES.map(R => {
  const path = roundedPath(R.pts);
  const len = path.getLength();
  const onFace = R.path === 'shared' && R.pts[0][2] > Z1;
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(path, Math.max(8, Math.ceil(len * 2)), onFace ? 0.11 : 0.15, 6, false),
    new THREE.MeshBasicMaterial({ color: TUBE[R.path], transparent: true, opacity: 0.6, depthWrite: false })
  );
  tube.renderOrder = 2;
  ROUTE_G.add(tube);
  const S = Math.max(16, Math.ceil(len * 3));
  const n = Math.max(2, Math.round(len / 1.7));
  const pts = pointsCloud(n, 0.72, { p: ROUTE_G });
  pts.renderOrder = 3;
  const col = pts.geometry.attributes.color.array, c = new THREE.Color();
  const seeds = Array.from({ length: n }, (_, i) => (i + Math.random() * 0.4) / n);
  const pal = R.kind === 'oil' ? [PCOL.oil, PCOL.oil, PCOL.water] : [PCOL[R.kind]];
  seeds.forEach((s, i) => { c.setHex(pal[i % pal.length]); col.set([c.r, c.g, c.b], i * 3); });
  const rt = { R, len, tube, pts, samples: path.getSpacedPoints(S), S, seeds, u: 0, dim: 0, dimT: 0 };
  placeParticles(rt);
  return rt;
});
/* dt is real time (dimming eases even while motion is paused); particles move only when `moving` */
function updateRoutes(dt, moving) {
  routes.forEach(rt => {
    if (moving && dt > 0) { rt.u = (rt.u + dt * 3 / rt.len) % 1; placeParticles(rt); }
    if (rt.dim === rt.dimT) return;
    rt.dim += (rt.dimT - rt.dim) * Math.min(1, dt * 6);
    if (Math.abs(rt.dim - rt.dimT) < 0.01) rt.dim = rt.dimT;
    rt.tube.material.opacity = 0.6 - 0.52 * rt.dim;
    rt.pts.material.opacity = 1 - 0.88 * rt.dim;
  });
}

  const cMat = new THREE.MeshPhongMaterial({ color: 0x3a3f45, shininess: 40 }), hMat = new THREE.MeshPhongMaterial({ color: 0xf3f5f7, shininess: 40 });
  const bMat = new THREE.MeshPhongMaterial({ color: 0x9aa5ae, shininess: 20 });
  const tet = [V3(1, 1, 1), V3(1, -1, -1), V3(-1, 1, -1), V3(-1, -1, 1)].map(v => v.normalize());
  if (kind === 'methane') {
    C.push(V3(0, 0, 0));
    tet.forEach(d => H.push([0, d.clone().multiplyScalar(1.09)]));
  } else {
    // zigzag chain of 8 carbons; two hydrogens on each inner carbon, three on each end
    for (let i = 0; i < 8; i++) C.push(V3(1.27 * i - 4.445, (i % 2) * 0.87 - 0.435, 0));
    C.forEach((c, i) => {
      const nb = [C[i - 1], C[i + 1]].filter(Boolean);
      if (nb.length === 2) {
        const u = c.clone().sub(nb[0]).normalize().add(c.clone().sub(nb[1]).normalize()).normalize();
        const n = nb[0].clone().sub(c).cross(nb[1].clone().sub(c)).normalize();
        [1, -1].forEach(sg => H.push([i, c.clone().add(u.clone().multiplyScalar(Math.cos(0.955)).add(n.clone().multiplyScalar(sg * Math.sin(0.955))).normalize().multiplyScalar(1.09))]));
      } else {
        const w = c.clone().sub(nb[0]).normalize(), p = V3(0, 0, 1), q = w.clone().cross(p).normalize();
        for (let k = 0; k < 3; k++) {
          const a = k * 2.094 + 0.4;
          const d = w.clone().multiplyScalar(Math.cos(1.23)).add(p.clone().multiplyScalar(Math.cos(a) * Math.sin(1.23))).add(q.clone().multiplyScalar(Math.sin(a) * Math.sin(1.23)));
          H.push([i, c.clone().add(d.normalize().multiplyScalar(1.09))]);
        }
      }
    });
  }
  const bond = (a, b) => {
    const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, d.length(), 10), bMat);
    m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize()); g.add(m);
  };
  C.forEach((c, i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.4, 22, 16), cMat); m.position.copy(c); g.add(m); if (i) bond(C[i - 1], c); });
  H.forEach(([ci, h]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.26, 18, 12), hMat); m.position.copy(h); g.add(m); bond(C[ci], h); });
  return g;
}
/* one hidden renderer draws both molecules into two plain 2D canvases */
function initMolecules() {
  if (!MOL) {
    const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1); r.setSize(640, 480, false); r.setClearColor(0x000000, 0);
    const mk = (kind, dist) => {
      const sc = new THREE.Scene();
      sc.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.85));
      const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(3, 5, 6); sc.add(dl);
      const mol = buildMolecule(kind); sc.add(mol);
      const cam = new THREE.PerspectiveCamera(35, 4 / 3, 0.1, 100); cam.position.set(0, 0.6, dist); cam.lookAt(0, 0, 0);
      return { sc, mol, cam, drag: null, ry: 0.4, rx: 0.25 };
    };
    MOL = { r, a: mk('methane', 6.2), b: mk('octane', 15.5), open: false };
  }
  MOL.open = true;
  // the canvases are new each time the modal opens, so their listeners are too
  [['#mol-a', MOL.a], ['#mol-b', MOL.b]].forEach(([sel, m]) => {
    const cv = $(sel);
    if (!cv) return;
    m.ctx = cv.getContext('2d');
    cv.addEventListener('pointerdown', e => { m.drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture?.(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (!m.drag) return; m.ry += (e.clientX - m.drag.x) * 0.012; m.rx = clamp(m.rx + (e.clientY - m.drag.y) * 0.01, -1.2, 1.2); m.drag = { x: e.clientX, y: e.clientY }; });
    const up = () => (m.drag = null);
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  });
}
function renderMolecules(dt) {
  if (!MOL || !MOL.open) return;
  [MOL.a, MOL.b].forEach(m => {
    if (!m.ctx) return;
    if (!m.drag && MOTION) m.ry += dt * 0.5;
    m.mol.rotation.set(m.rx, m.ry, 0);
    MOL.r.render(m.sc, m.cam);
    m.ctx.clearRect(0, 0, 640, 480);
    m.ctx.drawImage(MOL.r.domElement, 0, 0, 640, 480);
  });
}
function openMolecules() {
  openModal(`<h2 id="m-title">${escapeHTML(MOLECULES.title)}</h2>
    <div class="mol-wrap">
      <div class="mol"><canvas id="mol-a" width="640" height="480" role="img" aria-label="Rotating 3D model of a methane molecule: one carbon atom bonded to four hydrogen atoms"></canvas><h3>${escapeHTML(MOLECULES.methane[0])}</h3><p>${escapeHTML(MOLECULES.methane[1])}</p></div>
      <div class="mol"><canvas id="mol-b" width="640" height="480" role="img" aria-label="Rotating 3D model of an octane molecule: a chain of eight carbon atoms with eighteen hydrogen atoms"></canvas><h3>${escapeHTML(MOLECULES.octane[0])}</h3><p>${escapeHTML(MOLECULES.octane[1])}</p></div>
    </div>
    <div class="legend-atoms"><span><i class="atom-c"></i>Carbon</span><span><i class="atom-h"></i>Hydrogen</span><span>Drag a model to turn it</span></div>
    <p class="prose">${rich(MOLECULES.text, null)}</p>
    <p class="tiny">${escapeHTML(MOLECULES.note)}</p>`);
  initMolecules();
}

/* ---------- keyboard ---------- */
function stepFree(dir) {
  const s = STAGES.find(v => v.id === SEL);
  if (!s) return;
  if (s.id === 'lifting' && dir > 0) { select(FILTER === 'gasoline' ? 'crude-transport' : 'gas-plant'); return; }
  const seq = seqFor(s), i = seq.indexOf(s.id) + dir;
  if (i >= 0 && i < seq.length) select(seq[i]);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!modal.hidden) closeModal();
    else if (tipFor) hideTip();
    else if (!menu.hidden) { closeTourMenu(); bTour.focus(); }
    else if (!panel.classList.contains('closed')) closePanel();
    return;
  }
  if (!modal.hidden || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  // arrows belong to quiz answers, the tour menu and text fields when those have focus
  if (TOUR.inQuiz || (e.target.closest && e.target.closest('.q, .menu, input, textarea, select, [contenteditable]'))) return;
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  if (TOUR.key) { e.preventDefault(); if (dir > 0) tourNext(); else tourBack(); }
  else if (SEL) { e.preventDefault(); stepFree(dir); }
});

/* ---------- theme ---------- */
function refreshTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  const dark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  DIM_COLOR.setHex(dark ? 0x3b4756 : 0xdfe5eb);
  Object.values(ST).forEach(s => { if (s.dim > 0) applyDim(s); });
}
const mqDark = matchMedia('(prefers-color-scheme: dark)');
if (mqDark.addEventListener) mqDark.addEventListener('change', refreshTheme);
new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
refreshTheme();

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), TIME = 0;
function updatePanelLive() {
  if (LIVE.count) {
    const txt = TL.ma > 0 ? `≈ ${TL.ma} <small>million years ago</small>` : 'Today';
    if (LIVE.count.dataset.t !== txt) { LIVE.count.innerHTML = txt; LIVE.count.dataset.t = txt; }
    const w = (TL.T * 100).toFixed(1) + '%';
    if (LIVE.bar.style.width !== w) LIVE.bar.style.width = w;
    if (LIVE.cap.textContent !== TL.cap) LIVE.cap.textContent = TL.cap;
    const b = LIVE.btn;
    if (TL.playing) b.dataset.started = '1';
    if (b.dataset.started) {
      const label = TL.playing ? 'Playing…' : 'Replay the time-lapse';
      if (b.dataset.l !== label) { b.innerHTML = PLAY + label; b.dataset.l = label; b.setAttribute('aria-disabled', String(TL.playing)); }
    }
  }
  if (LIVE.strokes && LIVE.strokes.dataset.on !== String(ENG.stroke)) {
    LIVE.strokes.dataset.on = ENG.stroke;
    LIVE.strokes.querySelectorAll('div').forEach((d, i) => d.classList.toggle('on', i === ENG.stroke));
  }
}
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const adt = MOTION ? dt : 0;                           // animation time stands still while paused
  TIME += adt;
  stepFly(dt);
  updateViewOffset(dt);
  Object.values(ST).forEach(s => {
    const target = SEL === s.data.id ? 1 : 0;
    s.k += (target - s.k) * Math.min(1, dt * 5);
    if (Math.abs(target - s.k) < 0.003) s.k = target;
    s.pops.forEach(p => { p.visible = s.k > 0.01; p.scale.setScalar(Math.max(0.001, ease(s.k))); });
    if (s.anim) s.anim(TIME, adt, SEL === s.data.id, s.k);
  });
  updateRoutes(dt, MOTION);
  updateDims(dt);
  doHover();
  renderer.render(scene, camera);
  updateLabels();
  updatePanelLive();
  if (!modal.hidden) renderMolecules(dt);
  requestAnimationFrame(frame);
}

/* =====================================================================
   START
   ===================================================================== */
resize();
renderOverview();
{
  const v = visibleArea();
  VOFF.x = v.ox; VOFF.y = v.oy;
  applyViewOffset();
  const d = defaultView();
  setFromPosLook(d.pos, d.look);
  applyCam();
}
measureLabels();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureLabels(); invalidateVisible(); DETAILS.forEach(d => (d.shownText = null)); });
window.addEventListener('resize', () => { resize(); syncSheet(); measureLabels(); });
if (REDUCED) setMotion(false);                          // respect "reduce motion"; the Play button starts it
// test hook, only when the page is opened with #debug
if (location.hash === '#debug') window.__app = { renderer, flyToStage, select, startTour, tourNext, tourBack, ST, TOURS, STAGES, hitAt, camera, setFilter, TOUR, openMolecules, openCompare, closeModal, TL, resetView, project: p => project(p, canvas.clientWidth, canvas.clientHeight) };
requestAnimationFrame(frame);
</script>
